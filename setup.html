<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FlowAccess — Firebase Setup</title>
    <style>
        body { font-family: system-ui; background: #0a0a0f; color: #f8fafc; padding: 40px; max-width: 600px; margin: 0 auto; }
        h1 { color: #6366f1; }
        .status { padding: 12px; border-radius: 8px; margin: 10px 0; font-family: monospace; font-size: 13px; }
        .success { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); color: #22c55e; }
        .error { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #ef4444; }
        .pending { background: rgba(234,179,8,0.15); border: 1px solid rgba(234,179,8,0.3); color: #eab308; }
        button { background: #6366f1; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 600; margin-top: 20px; }
        button:hover { background: #4f46e5; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>🔧 FlowAccess Setup</h1>
    <p>This will create the required Firestore documents for your admin account.</p>
    
    <div id="log"></div>
    
    <button id="setupBtn" onclick="runSetup()">Run Setup</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBDuvhx4Uj4K0lmDZbUO8iRNb3FNK-qI7w",
            authDomain: "flow-access-1f022.firebaseapp.com",
            projectId: "flow-access-1f022",
            storageBucket: "flow-access-1f022.firebasestorage.app",
            messagingSenderId: "1047778033297",
            appId: "1:1047778033297:web:6d58852e9116c3979fc930"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        function log(msg, type = 'pending') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = msg;
            document.getElementById('log').appendChild(div);
        }

        window.runSetup = async function() {
            const btn = document.getElementById('setupBtn');
            btn.disabled = true;
            btn.textContent = 'Setting up...';
            document.getElementById('log').innerHTML = '';

            try {
                // 1. Sign in as admin
                log('⏳ Signing in as hussain@gmail.com...');
                const cred = await signInWithEmailAndPassword(auth, 'hussain@gmail.com', '12345678');
                log('✅ Signed in! UID: ' + cred.user.uid, 'success');

                // 2. Create config/admin document
                log('⏳ Creating config/admin document...');
                await setDoc(doc(db, 'config', 'admin'), {
                    adminEmails: ['hussain@gmail.com'],
                    maxSessionHours: 3,
                    rollingWindowHours: 24,
                    createdAt: serverTimestamp()
                });
                log('✅ config/admin created — adminEmails: ["hussain@gmail.com"]', 'success');

                // 3. Create config/encryption document
                log('⏳ Creating config/encryption document...');
                await setDoc(doc(db, 'config', 'encryption'), {
                    masterKey: 'a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2',
                    createdAt: serverTimestamp()
                });
                log('✅ config/encryption created — masterKey set', 'success');

                // 4. Create user profile document
                log('⏳ Creating user profile document...');
                await setDoc(doc(db, 'users', cred.user.uid), {
                    email: 'hussain@gmail.com',
                    displayName: 'Admin',
                    createdAt: serverTimestamp(),
                    isBanned: false,
                    totalUsageMinutes: 0,
                    role: 'admin'
                });
                log('✅ users/' + cred.user.uid + ' created', 'success');

                log('🎉 SETUP COMPLETE! You can now use the website and admin panel.', 'success');

            } catch (err) {
                log('❌ Error: ' + err.message, 'error');
                console.error(err);
            }

            btn.disabled = false;
            btn.textContent = 'Run Setup Again';
        };
    </script>
</body>
</html>
